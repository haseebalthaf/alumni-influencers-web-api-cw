<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumni Influencers - Profile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        padding-bottom: 40px;
      }

      .navbar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .navbar h1 {
        font-size: 1.8em;
        font-weight: 700;
      }

      .logout-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .logout-btn:hover {
        background: white;
        color: #667eea;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .page-header {
        text-align: center;
        margin-bottom: 40px;
        animation: slideIn 0.4s ease;
      }

      .page-header h2 {
        font-size: 2em;
        color: #333;
        margin-bottom: 10px;
      }

      .page-header p {
        color: #666;
        font-size: 1.05em;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #message {
        margin-bottom: 30px;
        padding: 18px 25px;
        border-radius: 12px;
        display: none;
        animation: slideDown 0.3s ease;
        font-weight: 500;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #message.success {
        background: #d4edda;
        color: #155724;
        border: 2px solid #c3e6cb;
      }

      #message.error {
        background: #f8d7da;
        color: #721c24;
        border: 2px solid #f5c6cb;
      }

      .section {
        background: white;
        margin-bottom: 30px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        border-left: 6px solid #667eea;
        animation: slideIn 0.5s ease;
      }

      .section h2 {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.4em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section h2::before {
        content: "";
        width: 4px;
        height: 28px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 2px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #333;
        font-size: 0.95em;
      }

      .required {
        color: #ff6b6b;
      }

      input[type="text"],
      input[type="url"],
      input[type="date"],
      input[type="file"],
      textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1em;
        font-family: inherit;
        transition: all 0.3s ease;
        background: #f8f9fa;
      }

      input[type="text"]:focus,
      input[type="url"]:focus,
      input[type="date"]:focus,
      input[type="file"]:focus,
      textarea:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      textarea {
        height: 100px;
        resize: vertical;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .array-item {
        border: 2px solid #e0e0e0;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 10px;
        position: relative;
        background: #f8f9fa;
        transition: all 0.3s ease;
      }

      .array-item:hover {
        border-color: #667eea;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
      }

      .array-item .grid {
        margin-bottom: 0;
      }

      .remove-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .remove-btn:hover {
        background: #ff5252;
        transform: scale(1.05);
      }

      .add-btn {
        background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(81, 207, 102, 0.3);
      }

      .add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(81, 207, 102, 0.4);
      }

      .add-btn:active {
        transform: translateY(0);
      }

      button[type="submit"],
      .back-btn {
        padding: 15px 30px;
        border: none;
        border-radius: 10px;
        font-size: 1.05em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      button[type="submit"] {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      button[type="submit"]:active {
        transform: translateY(0);
      }

      .back-btn {
        background: #e9ecef;
        color: #333;
        border: 2px solid #dee2e6;
      }

      .back-btn:hover {
        background: #dee2e6;
        transform: translateY(-2px);
      }

      .section.profile-image {
        border-left-color: #51cf66;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
      }

      .file-input-wrapper input[type="file"] {
        position: absolute;
        left: -9999px;
      }

      .image-preview-container {
        margin-top: 25px;
        text-align: center;
        animation: slideIn 0.3s ease;
      }

      .image-preview {
        width: 180px;
        height: 180px;
        border-radius: 15px;
        object-fit: cover;
        border: 3px solid #667eea;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        display: block;
        margin: 0 auto 15px auto;
        transition: transform 0.3s ease;
      }

      .image-preview:hover {
        transform: scale(1.05);
      }

      .preview-text {
        color: #666;
        font-size: 0.9em;
        font-weight: 500;
        margin-top: 10px;
      }

      @media (max-width: 768px) {
        .navbar {
          padding: 15px 20px;
        }

        .navbar h1 {
          font-size: 1.4em;
        }

        .container {
          margin: 30px auto;
        }

        .section {
          padding: 20px;
        }

        .page-header h2 {
          font-size: 1.5em;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>🎓 My Profile</h1>
      <div>
        <a class="logout-btn" href="bidding.html">Bidding</a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="container">
      <div class="page-header">
        <h2>Complete Your Alumni Profile</h2>
        <p>Build your professional presence in the Alumni Network</p>
      </div>

      <div id="message"></div>

      <form id="profileForm">
        <!-- Personal Information -->
        <div class="section">
          <h2>Personal Information</h2>
          <div class="grid">
            <div class="form-group">
              <label for="firstName"
                >First Name <span class="required">*</span></label
              >
              <input type="text" id="firstName" required />
            </div>
            <div class="form-group">
              <label for="lastName"
                >Last Name <span class="required">*</span></label
              >
              <input type="text" id="lastName" required />
            </div>
          </div>
          <div class="form-group full-width">
            <label for="biography"
              >Biography <span class="required">*</span></label
            >
            <textarea
              id="biography"
              maxlength="500"
              placeholder="Tell us about yourself, your career path, and your interests..."
              required
            ></textarea>
          </div>
          <div class="form-group full-width">
            <label for="linkedInUrl">LinkedIn Profile URL</label>
            <input
              type="url"
              id="linkedInUrl"
              placeholder="https://www.linkedin.com/in/yourprofile"
            />
          </div>
        </div>

        <!-- Degrees -->
        <div class="section">
          <h2>Education - Degrees</h2>
          <div id="degreesContainer"></div>
          <button type="button" class="add-btn" id="addDegreeBtn">
            + Add Degree
          </button>
        </div>

        <!-- Certifications -->
        <div class="section">
          <h2>Professional Certifications</h2>
          <div id="certificationsContainer"></div>
          <button type="button" class="add-btn" id="addCertificationBtn">
            + Add Certification
          </button>
        </div>

        <!-- Licences -->
        <div class="section">
          <h2>Professional Licences</h2>
          <div id="licencesContainer"></div>
          <button type="button" class="add-btn" id="addLicenceBtn">
            + Add Licence
          </button>
        </div>

        <!-- Courses -->
        <div class="section">
          <h2>Professional Courses</h2>
          <div id="coursesContainer"></div>
          <button type="button" class="add-btn" id="addCourseBtn">
            + Add Course
          </button>
        </div>

        <!-- Employment History -->
        <div class="section">
          <h2>Employment History</h2>
          <div id="employmentContainer"></div>
          <button type="button" class="add-btn" id="addEmploymentBtn">
            + Add Employment
          </button>
        </div>

        <!-- Profile Image -->
        <div class="section profile-image">
          <h2>Profile Picture</h2>
          <div class="form-group">
            <label for="profileImage">Upload Your Profile Image</label>
            <input type="file" id="profileImage" accept="image/*" />
            <div
              class="image-preview-container"
              id="imagePreviewContainer"
              style="display: none"
            >
              <img id="imagePreview" class="image-preview" alt="Preview" />
              <p class="preview-text">Preview</p>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div>
          <button type="submit">💾 Save Profile</button>
        </div>
      </form>
    </div>

    <script src="profile.js"></script>
  </body>
</html>
