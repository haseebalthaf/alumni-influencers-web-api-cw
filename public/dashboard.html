<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Alumni Influencers</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        display: flex;
        color: #333;
      }

      .sidebar {
        width: 260px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 20px;
        position: fixed;
        height: 100vh;
        overflow-y: auto;
        z-index: 1000;
      }

      .sidebar h2 {
        font-size: 1.5rem;
        margin-bottom: 40px;
        text-align: center;
      }

      .sidebar-menu {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-menu a,
      .sidebar-menu button {
        display: block;
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        text-align: left;
      }

      .sidebar-menu a:hover,
      .sidebar-menu button:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateX(4px);
      }

      .main-content {
        margin-left: 260px;
        flex: 1;
        padding: 30px;
      }

      .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .dashboard-header h1 {
        font-size: 2.2rem;
        color: #333;
      }

      .dashboard-title {
        color: #667eea;
      }

      .filters-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
        align-items: center;
      }

      .filters-row label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.95rem;
        color: #444;
      }

      .filters-row select {
        min-width: 210px;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: white;
        color: #111827;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      @media (max-width: 1200px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        margin-bottom: 16px;
        font-size: 1.25rem;
      }

      .card-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.92rem;
        text-decoration: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        transition: all 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
      }

      .btn.secondary {
        background: rgba(102, 126, 234, 0.1);
        color: #667eea;
        border: 1px solid #667eea;
      }

      .btn.secondary:hover {
        background: rgba(102, 126, 234, 0.2);
      }

      .button-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      canvas {
        width: 100%;
        max-height: 300px;
      }

      .chart-status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.95rem;
        text-align: center;
      }

      .chart-loading {
        background: rgba(102, 126, 234, 0.08);
        color: #334155;
      }

      .chart-error {
        background: rgba(254, 226, 226, 0.9);
        color: #b91c1c;
        border: 1px solid rgba(239, 68, 68, 0.25);
        font-weight: 600;
      }

      .token-error {
        background: rgba(254, 226, 226, 0.95);
        border: 2px solid #dc2626;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 24px;
        text-align: center;
      }

      .token-error-content h3 {
        color: #b91c1c;
        margin-bottom: 12px;
        font-size: 1.1rem;
      }

      .token-error-content p {
        color: #991b1b;
        margin-bottom: 16px;
      }

      .token-error-content button {
        background: #dc2626;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .token-error-content button:hover {
        background: #b91c1c;
      }

      @media (max-width: 768px) {
        .sidebar {
          position: relative;
          width: 100%;
          height: auto;
          padding: 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .sidebar h2 {
          margin-bottom: 0;
          font-size: 1.2rem;
        }

        .sidebar-menu {
          flex-direction: row;
          gap: 8px;
        }

        .sidebar-menu a,
        .sidebar-menu button {
          padding: 10px 12px;
          font-size: 0.85rem;
        }

        .main-content {
          margin-left: 0;
          padding: 20px;
        }

        .dashboard-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .dashboard-header h1 {
          font-size: 1.8rem;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .filters-row {
          flex-direction: column;
          gap: 12px;
        }

        .filters-row label {
          margin-bottom: -8px;
        }

        .filters-row select {
          min-width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/shared/sidebar.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="dashboard-header">
        <h1><span class="dashboard-title">📊</span> Dashboard</h1>
      </div>

      <div class="filters-row">
        <label>
          Industry
          <select id="industryFilter">
            <option value="">All industries</option>
          </select>
        </label>

        <label>
          Degree
          <select id="degreeFilter">
            <option value="">All degrees</option>
          </select>
        </label>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-header-row">
            <h3>Skills Demand Chart</h3>
            <div class="button-group">
              <button class="btn secondary" id="exportSkillsBtn">
                📥 Export CSV
              </button>
              <button class="btn secondary" onclick="downloadSkillsChart()">
                🖼️ Download
              </button>
            </div>
          </div>
          <canvas id="skillsChart"></canvas>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Industry Distribution Chart</h3>
            <button class="btn secondary" onclick="downloadIndustryChart()">
              🖼️ Download
            </button>
          </div>
          <canvas id="industryChart"></canvas>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Alumni Growth Chart</h3>
            <button class="btn secondary" onclick="downloadGrowthChart()">
              🖼️ Download
            </button>
          </div>
          <canvas id="growthChart"></canvas>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Certification Trends Chart</h3>
            <button
              class="btn secondary"
              onclick="downloadCertificationsChart()"
            >
              🖼️ Download
            </button>
          </div>
          <canvas id="certificationChart"></canvas>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Career Paths Chart</h3>
            <button class="btn secondary" onclick="downloadCareerPathsChart()">
              🖼️ Download
            </button>
          </div>
          <canvas id="careerChart"></canvas>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Courses/Licences Chart</h3>
            <button class="btn secondary" onclick="downloadCoursesChart()">
              🖼️ Download
            </button>
          </div>
          <canvas id="coursesChart"></canvas>
        </div>
      </div>
    </div>

    <script src="/shared/utils.js"></script>
    <script src="/vendor/chart.js/chart.umd.min.js"></script>
    <script src="analytics-utils.js"></script>
    <script src="index.js"></script>
    <script>
      // Load shared sidebar
      fetch("/shared/sidebar.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("sidebar-container").innerHTML = html;
          window.SharedUtils?.applySidebarRoleVisibility?.(
            document.getElementById("sidebar-container"),
          );
          // Set up logout handler
          const logoutBtn = document.getElementById("sidebarLogoutBtn");
          if (logoutBtn) {
            logoutBtn.addEventListener(
              "click",
              window.SharedUtils?.handleLogout || handleLogout,
            );
          }
        })
        .catch((error) => console.error("Failed to load sidebar:", error));
    </script>
  </body>
</html>
